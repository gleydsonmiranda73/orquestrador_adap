<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="src/css/styles.css">
    <title>Orquestrador Python</title>
</head>
<body>
    <nav id="sidebar">
        <div id="sidebar_content">
            <div id="user">
                <img src="src/images/avatar.jpg" id="user_avatar" alt="Avatar">
    
                <p id="user_infos">
                    <span class="item-description">
                        Gleydson Miranda
                    </span>
                    <span class="item-description">
                        Analista de Dados & RPA
                    </span>
                </p>
            </div>
    
            <ul id="side_items">
                <li class="side-item active">
                    <a href="#">
                        <!-- <i class="fa-solid fa-robot"></i> -->
                        <i class="fa-solid fa-robot" style="color: #fff;"></i>
                        <span class="item-description">
                            Processos
                        </span>
                    </a>
                </li>
    
                <li class="side-item">
                    <a href="#">
                        <i class="fa-solid fa-computer" style="color: #fff;"></i>
                        <span class="item-description">
                            Máquinas
                        </span>
                    </a>
                </li>
    
                <li class="side-item">
                    <a href="#">
                        <i class="fa-solid fa-bell" style="color: #fff;"></i>
                        <span class="item-description">
                            Log
                        </span>
                    </a>
                </li>
    
                <li class="side-item">
                    <a href="#">
                        <i class="fa-solid fa-box" style="color: #fff;"></i>
                        <span class="item-description">
                            Aposentados
                        </span>
                    </a>
                </li>
    
                <li class="side-item">
                    <a href="#">
                        <i class="fa-solid fa-lock" style="color: #fff;"></i>
                        <span class="item-description">
                            Credenciais
                        </span>
                    </a>
                </li>
    
                <li class="side-item">
                    <a href="#">
                        <i class="fa-solid fa-chart-line" style="color: #fff;"></i>
                        <span class="item-description">
                            Dashboard
                        </span>
                    </a>
                </li>

                <li class="side-item">
                    <a href="#">
                        <i class="fa-solid fa-exclamation" style="color: #fff;"></i>
                        <span class="item-description">
                            Sobre
                        </span>
                    </a>
                </li>
            </ul>
    
            <button id="open_btn">
                <i id="open_btn_icon" class="fa-solid fa-chevron-right" style="color: #fff;"></i>
            </button>
        </div>

        <div id="logout">
            <button id="logout_btn">
                <i class="fa-solid fa-right-from-bracket" style="color: #fff;"></i>
                <span class="item-description">
                    Sair
                </span>
            </button>
        </div>
    </nav>

    <main class="corpo-pagina">
        <header class="main-header">
            <div class="maquinas">
                <div class="cima">
                    <p>Zeus</p>
                </div>
                <div class="baixo">
                    <div class="circulo">
                        <p>Z</p>
                    </div>
                </div>
            </div>
            <div class="maquinas">
                <div class="cima" >
                    <p>Zeus</p>
                </div>
                <div class="baixo">
                    <div class="circulo">
                        <p>Z</p>
                    </div>
                </div>
            </div>
            <div class="maquinas"></div>
            <div class="maquinas"></div>
            <div class="maquinas"></div>
            <div class="maquinas"></div>
        </header>
    </main>
    <script src="src/javascript/script.js"></script>
</body>
</html>
